<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tutor IA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="sidebar">
        <div class="sidebar-brand"><strong>Tutor</strong>IA</div>

        <button class="new-chat-btn">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                <path d="M7 1V13M1 7H13" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
            </svg>
            Nova conversa
        </button>

        <div class="chat-history"></div>
    </div>

    <div class="chat">
        <div class="chat-header">
            <button class="header-btn">
                <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                    <rect x="1" y="1" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.3" />
                    <rect x="8" y="1" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.3" />
                    <rect x="1" y="8" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.3" />
                    <rect x="8" y="8" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.3" />
                </svg>
                Cards Informativos
            </button>
        </div>
        <div class="messages">
            <div class="messages-inner"></div>
        </div>
        <div class="cards hidden">
            <div class="cards-grid"></div>
        </div>

        <div class="prompt_area">
            <div class="prompt_inner">
                <textarea class="text" rows="1" placeholder="Envie uma mensagem..."></textarea>
                <button id="send_btn" disabled>
                    <svg class="seta" width="15" height="15" viewBox="0 0 15 15" fill="none">
                        <path d="M7.5 12.5V2.5M7.5 2.5L3 7M7.5 2.5L12 7" stroke="currentColor" stroke-width="1.6"
                            stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                    <svg class="lupa hidden" width="15" height="15" viewBox="0 0 15 15" fill="none">
                        <path
                            d="M6.5 11C8.98528 11 11 8.98528 11 6.5C11 4.01472 8.98528 2 6.5 2C4.01472 2 2 4.01472 2 6.5C2 8.98528 4.01472 11 6.5 11Z"
                            stroke="currentColor" stroke-width="1.5" />
                        <path d="M10 10L13 13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
                    </svg>
                </button>
            </div>
        </div>
        <div class="hint" style="padding-bottom:10px">Enter envia · Shift+Enter quebra linha</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
    <script type="module" src="js/script.js"></script>
</body>

</html>
